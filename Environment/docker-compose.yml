services:
  # Auth Service Database
  auth-service-db:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_secret_2024
    volumes:
      - pgdata-auth:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "auth_user", "-d", "auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Auth Service
  auth-service:
    build:
      context: ../AuthService
      dockerfile: Dockerfile
    environment:
      - AUTH_SERVICE_DB_CONNECTION_STRING=Host=auth-service-db;Port=5432;Database=auth_db;Username=auth_user;Password=auth_secret_2024
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5102:5002"
      - "5104:5004"
    depends_on:
      auth-service-db:
        condition: service_healthy

  # Space Service Database
  space-service-db:
    image: postgres:16
    environment:
      POSTGRES_DB: space_db
      POSTGRES_USER: space_user
      POSTGRES_PASSWORD: space_secret_2024
    volumes:
      - pgdata-space:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "space_user", "-d", "space_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Space Service
  space-service:
    build:
      context: ../SpaceService
      dockerfile: Dockerfile
    environment:
      - SPACE_SERVICE_DB_CONNECTION_STRING=Host=space-service-db;Port=5432;Database=space_db;Username=space_user;Password=space_secret_2024
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5202:5002"
      - "5204:5004"
    depends_on:
      space-service-db:
        condition: service_healthy

  # Finance Service Database
  finance-service-db:
    image: postgres:16
    environment:
      POSTGRES_DB: finance_db
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_secret_2024
    volumes:
      - pgdata-finance:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "finance_user", "-d", "finance_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Finance Service
  finance-service:
    build:
      context: ../FinanceService
      dockerfile: Dockerfile
    environment:
      - FINANCE_SERVICE_DB_CONNECTION_STRING=Host=finance-service-db;Port=5432;Database=finance_db;Username=finance_user;Password=finance_secret_2024
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5302:5002"
      - "5304:5004"
    depends_on:
      finance-service-db:
        condition: service_healthy

  # ApiGateway (no database - just routing)
  api-gateway:
    build:
      context: ../ApiGateway
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - AUTH_SERVICE_URL=http://auth-service:5001
      - SPACE_SERVICE_URL=http://space-service:5002
      - FINANCE_SERVICE_URL=http://finance-service:5003
    ports:
      - "5004:80"
    depends_on:
      - auth-service
      - space-service
      - finance-service

volumes:
  pgdata-auth:
  pgdata-space:
  pgdata-finance: